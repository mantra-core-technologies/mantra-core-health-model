      value sets, workers, índices, fases, criterios de aceptación) para envíos
      programados, gobierno exclusivo SITE_ADMINISTRATION y tracking multicanal
      en 3 capas. Fuente de los § que cita el patch-02.
  - id: patch-02-use-cases-scheduled-campaigns-tracking
    role: use-case-derivation
    doc: docs/architecture/patch-v4.0.1-scheduled-campaigns-tracking.md
    source_file: PATCH_v4.0_casos_uso_envios_programados_tracking.md
    status: materialized-in-er
    summary: >-
      37 casos de uso (UC-06/10/30/35/48/49/50-*) derivados del patch-01, en 7
      módulos. Nombres normalizados a los canónicos: audit_events→audit_log,
      outbox_events→outbox_messages.
  - id: patch-v4.0.2-agenda-prestigio-bloqueos-buzon
    role: product-features
    doc: vault (SALUD/🧩 Patch v4.0.2 — Agenda, Prestigio, Bloqueos y Buzón)
    status: materialized-physically
    summary: >-
      Horarios del profesional, puntos de prestigio, bloqueos de agenda por
      vacaciones y buzón de reclamos. +6 entidades (community.prestige_scores/
      prestige_awards/feedback_tickets/feedback_ticket_comments/
