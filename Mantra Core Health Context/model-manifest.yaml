  - id: patch-v4.0.7-registro-atomico-cti
    role: standard-audit
    doc: vault (SALUD/🧩 Patch v4.0.7 — Registro atómico de perfiles (CTI))
    status: no-schema-change
    summary: >-
      Auditoría de los 68 casos de uso (0 violaciones del antipatrón de clase
      hija CTI) + regla 11 del estándar (padre e hija en la misma transacción,
      persons → person_profiles → *_profiles) + 4 casos de uso ejemplares
      UC-05-01..04.
  - id: patch-v4.0.8-promocion-reglas-alovida
    role: drift-correction
    doc: docs/architecture/physical-materialization.md (§ v4.0.8)
    status: materialized-in-er
    summary: >-
      Corrección de deriva en la dirección prohibida. El backend
      (mantra-core-health-api) había declarado DDL propio en database/SQL/
      —6 migraciones, 1 política RLS y 1 seed— fuera de los .puml y de SQL/. Ese
      DDL no lo aplicaba docker/db-init, así que la deriva estaba latente y no
      consumada: al inspeccionar la base antes del rebuild las 5 tablas no
      existían. El vector sí era real: con ORM_SCHEMA_SYNC en su default 'safe'
      y las entidades ya en el ORM, el siguiente arranque las habría creado.
      Se promueven al modelo 5 tablas (authz.care_relationships,
      authz.patient_legal_representations,
      clinical.prescription_signature_policies,
      scheduling.booking_confirmation_rules, iam.account_activations), 5 index
      sets y 11 extensiones de columnas (journal_transactions.approved_at/
      approved_by_user_id; medication_requests.signed_at/signed_by_user_id/
      issued_at/status_reason_text/replaces_request_id/replaced_by_request_id/
      renewed_from_request_id; appointment_bookings.cancellation_policy_snapshot;
      iam.users.must_change_password), en los módulos 01/06/08/16/41. Reglas
      ALOVIDA que las sostienen: CAN-AUTH-001, C-06, C-07, A-03, C-11, C-17, C-18,
      D-05, CAN-RX, CAN-APT, CAN-IDENT. Las FKs que las migraciones declaraban
      como comentario son ahora constraints reales; eso destapó que
      care_relationships.practitioner_profile_id apuntaba a
      profiles.practitioner_profiles, que no existe (la real es
      profiles.health_practitioner_profiles, resuelta por nota FK del vault
      contra su PK CTI profile_id). mantra-core-health-api/database/ se eliminó.
  - id: patch-v4.0.9-promocion-verificacion-y-reset
    role: drift-correction
    doc: docs/architecture/physical-materialization.md (§ v4.0.9)
    status: materialized-in-er
    summary: >-
      Segunda corrección de deriva del mismo origen que v4.0.8, y por la misma
      causa: un merge de dev devolvió mantra-core-health-api/database/ junto con
      los montajes del compose apuntando a esa copia interna, y encima de ella se
      siguieron escribiendo migraciones sueltas. Esta vez la deriva SÍ estaba
      consumada en su efecto: iam.email_verifications no existía en base limpia y
      los 27 casos de registro del smoke fallaban con 500. Se promueven al modelo
      2 tablas (iam.email_verifications, iam.password_resets), 2 index sets, 1
      extensión de columna (clinical.medication_requests.issue_idempotency_key) y
      2 índices únicos PARCIALES: uq_medication_requests_issue_idempotency_key y
      ux_authentication_credentials_live_password_subject, el primero del modelo
      que lleva concept_id como UUID literales — excepción consciente a la regla
      de no hardcodear conceptos, porque el predicado de un índice parcial debe
      ser inmutable y Postgres no admite subconsultas ahí. Reglas ALOVIDA que las
      sostienen: CAN-IDENT, CAN §6 (MISSING_IDEMPOTENCY). De paso se corrigió el
      generador del catálogo del ORM, que ignoraba la etiqueta UX y descartaba el
      predicado WHERE: por eso ux_account_activations_token_hash (v4.0.8) se había
      perdido del catálogo y un índice parcial habría salido como UNIQUE total.
      mantra-core-health-api/database/ se eliminó otra vez, ahora con un chequeo
      (salud-db/check_ddl_sources.py) que convierte su regreso en un fallo
      ruidoso. Política escrita en docs/architecture/ddl-sources.md.
  - id: patch-v4.0.10-endurecimiento-pipeline
    role: pipeline-hardening
    doc: docs/architecture/physical-materialization.md (§ v4.0.10)
    status: materialized-in-er
    summary: >-
      Cierre de las tres deudas de generador que destapó v4.0.9, sin tablas ni
      columnas nuevas. (1) Identificadores > 63 bytes: gen_ddl.py emitía 58
      nombres de FK y 1 de índice que PostgreSQL truncaba EN SILENCIO, y la capa
      06 del bootstrap del ORM —que sí acorta con prefijo 54 + sha1-8— los daba
      por ausentes y proponía recrearlos en cada arranque; pg_ident() porta ese
      algoritmo a gen_ddl.py (paridad verificada 58/58 byte-idéntica), SQL/
      renombra los 59, y las bases vivas migran con el patch
      2026-08-06_v4010_rename_long_identifiers.sql. (2) WORM de auditoría
      (CAN-AUDIT-001/C-19): promovido de patch suelto a la matriz del módulo 33
      — audit_log prohíbe UPDATE+DELETE (trg_forbid_mutation) y data_access_log
      SOLO UPDATE (trg_forbid_update, clave nueva `UPDATE : forbidden` en
      gen_integrity.py): el DELETE queda para la purga de retención UC-10-09.
      Nace SQL/10_audit/05_constraints.sql y gen_apply lo engancha solo. (3)
      Entidades: la regeneración vuelve a ser segura — gen_entities.py preserva
      los bloques JSDoc existentes y el barrel conserva exports ajenos (las 6
      tablas fantasma y los .types.ts de contratos jsonb); los contratos
      RuleCondition y CancellationPolicySnapshot salen de las entidades a
      archivos .types.ts propios. Política en ADR-0022: cuerpo por
      gen_entities.py, formato por prettier, JSDoc por docs:tsdoc; orm:gen
      retirado (declaraba un flujo por introspección que nunca produjo las
      entidades del repo). Los +2 entity declarations son los stubs de la
      matriz del módulo 33 (audit_log, data_access_log), no tablas nuevas.
  materialization_note: >-
    v4.0.1 materializado en el ER (fuente: el vault/grafo). Se añadieron 14
    entidades nuevas (marketing.campaign_schedules/dispatches/dispatch_recipients,
    crm.contact_channel_endpoints, messaging.adapter_tracking_capabilities/
    adapter_event_mappings/adapter_inbound_events/delivery_tracking_events/
    delivery_status_transitions/delivery_reconciliation_runs, authz.service_principals,
    read_models.campaign_dispatch_summary/recipient_delivery_timeline/adapter_health_summary)
    + 10 extensiones de columnas + 11 index sets, en modules 06/30/35/48/49/50.
    Nombres normalizados: audit_events->audit_log, outbox_events->outbox_messages.
  inventory:
    modules_puml: 64
    schemas: 52
    entity_declarations_total: 2671
    table_like_elements: 1245
    view_elements: 81
    index_sets: 1225
    reference_only_stubs: 120
    fk_references: 6672
    note: >-
      Cifras producidas por tools/model_inventory.py (fuente única reproducible:
      clasifica cada `entity` en una sola clase, suma == total). v4.0 base
      (2582 entity / 1201 tablas / 78 vistas / 1183 idx / 6336 FK) + v4.0.1
      (14 entidades = 11 tablas + 3 vistas · 11 index sets · 10 extensiones de
      columnas · +116 FK) => 2607 entity / 1212 tablas / 81 vistas / 1194 idx /
      6452 FK / 120 ref / 52 schemas. + v4.0.2–v4.0.6 (24 tablas · 24 index
      sets · 8 extensiones de columnas · +174 FK, módulos 01/04/06/11/16/19/
      38/41/42) => 2655 entity / 1236 tablas / 81 vistas / 1218 idx / 6626 FK /
      120 ref / 52 schemas. v4.0.7 no altera el inventario. + v4.0.8
      (5 tablas · 5 index sets · 11 extensiones de columnas · +38 FK, módulos
      01/06/08/16/41) => 2665 entity / 1241 tablas / 81 vistas / 1223 idx /
      6664 FK / 120 ref / 52 schemas. + v4.0.9 (2 tablas · 2 index sets · 1
      extensión de columna · +8 FK, módulos 01/08) => 2669 entity / 1243 tablas /
      81 vistas / 1225 idx / 6672 FK / 120 ref / 52 schemas. + v4.0.10 (2 stubs
      de la matriz del módulo 33, sin tablas nuevas — model_inventory los
      clasifica en table_like por llevar IMMUTABLE/APPEND_ONLY además de
      REFERENCE_ONLY, igual que los 13 preexistentes de la matriz) => 2671
      entity / 1245 table_like / 81 vistas / 1225 idx / 6672 FK / 120 ref /
      52 schemas.
  database: PostgreSQL canonical + governed specialized stores
  rules:
    one_puml_per_module: true
    indexes_embedded_in_each_data_module: true
    public_schema_objects_allowed: false
    dynamic_postgresql_enums_allowed: false
    postgresql_is_canonical_source_of_truth: true
    unsafe_dual_writes_allowed: false
    cross_store_deletion_verification_required: true
  standards_alignment:
  - AWS Well-Architected Operational Excellence concepts
  - Meta Marketing API / Conversions API concepts
  - Libélula multichannel payment integration concepts
  - HL7 FHIR R5 clinical and diagnostics resources
  - DICOMweb imaging access concepts
  - ISO 15189 medical laboratory quality and competence
  - LOINC terminology for observations and laboratory results
  - OHDSI OMOP Common Data Model transformation governance
  - WHO Surgical Safety Checklist phases
  - SAP S/4HANA financial/ERP concepts
  - Salesforce activity relationship concepts
  - Polyglot persistence governance and transactional outbox projection patterns
  - MongoDB-compatible document validation, compound, multikey and TTL indexing concepts
  - Redis keyspace, TTL, stream, fencing and atomic idempotency concepts
  - OpenSearch-compatible template, alias, routing, full-text and lifecycle concepts
  - Time-series partitioning, compression, retention and rollup concepts
  - Vector retrieval, evidence, metadata filtering and deletion propagation concepts
  - Object storage versioning, encryption, WORM and DICOM hierarchy concepts
  - Property graph projection and scoped traversal concepts
  - Lakehouse data product, schema, quality, lineage and controlled research release
    concepts
